# Routes every alert to the local alert-sink, which logs it (docs/operations-plan.md §7).
route:
  receiver: alert-sink
  group_by: [severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:8080/alerts
        send_resolved: true
