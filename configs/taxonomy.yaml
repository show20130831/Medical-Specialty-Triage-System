# Domain taxonomy for re-labeling MTSamples' 40 original `medical_specialty`
# values into the eight specialty groups served by the API.
#
#   1. direct_mapping: specialties with an unambiguous 1:1 group.
#   2. keyword_weights: catch-all specialties (Surgery, Radiology, SOAP notes,
#      Discharge Summary) are scored against each group by summing the weights of
#      keyword substrings found in the cleaned `keywords` field (2 = specific
#      term, 1 = shared anatomical term); the argmax group wins, zero scores are
#      dropped. See triage_training.taxonomy.
#
# This file is versioned experiment data: its SHA-256 is recorded in every
# dataset manifest, so editing it requires re-running prepare-data and training.

direct_mapping:
  "Cardiovascular / Pulmonary": "Cardiovascular & Pulmonary"
  "Gastroenterology": "Gastroenterology"
  "Neurology": "Neurology"
  "Neurosurgery": "Neurology"
  "Psychiatry / Psychology": "Neurology"
  "Orthopedic": "Orthopedics"
  "Physical Medicine - Rehab": "Orthopedics"
  "Pain Management": "Orthopedics"
  "Obstetrics / Gynecology": "OB-GYN"
  "Urology": "Urology"
  "ENT - Otolaryngology": "ENT & Ophthalmology"
  "Ophthalmology": "ENT & Ophthalmology"
  "Dentistry": "ENT & Ophthalmology"
  "Internal Medicine": "General Medicine"
  "General Medicine": "General Medicine"
  "Office Notes": "General Medicine"
  "Allergy / Immunology": "General Medicine"
  "Endocrinology": "General Medicine"
  "Hematology - Oncology": "General Medicine"
  "Nephrology": "General Medicine"
  "Rheumatology": "General Medicine"
  "Infectious Disease": "General Medicine"

keyword_reclassification_specialties:
  - "Surgery"
  - "Radiology"
  - "SOAP / Chart / Progress Notes"
  - "Discharge Summary"

