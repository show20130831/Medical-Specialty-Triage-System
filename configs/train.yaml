# Training pipeline configuration. Every value is required; the loader in
# triage_training.config fails on missing or unknown keys instead of falling back
# to defaults hidden in code. Relative paths resolve from the repository root.

data:
  raw_csv: data/mtsamples.csv
  encoding: cp1252 # the Kaggle export is Windows-1252, not UTF-8
  taxonomy: configs/taxonomy.yaml
  min_class_size: 100

split:
  test_size: 0.2 # fraction of unique descriptions held out for test
  val_size: 0.2 # fraction of the remainder held out for checkpoint selection
  seed: 42

paths:
  data_dir: outputs/data # prepared splits (contain medical text; never committed)
  runs_dir: outputs/runs # baseline and fine-tuning runs

baseline:
  tfidf:
    max_features: 30000
    ngram_range: [1, 3]
    min_df: 2
    max_df: 0.4
    sublinear_tf: true
  logistic_regression:
    C: 1.0
    class_weight: balanced
    max_iter: 1000

finetune:
  model_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
  max_length: 512
  epochs: 8
  learning_rate: 1.0e-5
  train_batch_size: 16
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  warmup_ratio: 0.1
  early_stopping_patience: 3
  seed: 42
