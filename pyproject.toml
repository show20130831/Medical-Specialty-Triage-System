[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-specialty-triage-system"
version = "0.1.0"
description = "A description-based medical specialty classification service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "prometheus-client==0.25.0",
    "PyYAML==6.0.3",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
inference = [
    "torch==2.14.1",
    "transformers==5.16.1",
]
train = [
    "numpy>=1.26,<3",
    "pandas==2.2.3",
    "PyYAML==6.0.3",
    "scikit-learn==1.6.1",
    "scipy>=1.10,<2",
]
finetune = [
    "accelerate==1.14.0",
]
test = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["triage_system*", "triage_training*"]
namespaces = false

[tool.setuptools.package-data]
triage_system = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
