name: API CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: API tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,train]"

      - name: Run tests
        run: python -B -m pytest -q -p no:cacheprovider

      - name: Check dependency compatibility
        run: python -m pip check

  service-smoke:
    name: Service smoke test (tiny model bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,inference]"

      - name: Serve a tiny bundle end to end
        run: python -B -m pytest -q -p no:cacheprovider tests/test_service_smoke.py

  docker:
    name: Docker image build and health check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t triage-system:ci .

      - name: Start without a model and probe health and readiness
        run: |
          docker run -d --name triage -p 8000:8000 triage-system:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          test "$(docker exec triage whoami)" = "app"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = "503"
          docker logs triage

  monitoring-config:
    name: Monitoring configuration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" \
            prom/prometheus:v3.5.0 check rules /m/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/deploy/monitoring:/m:ro" \
            prom/alertmanager:v0.28.1 check-config /m/alertmanager.yml

      - name: Validate Compose file
        run: docker compose --profile monitoring config --quiet
